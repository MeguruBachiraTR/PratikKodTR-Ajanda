<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Ajandam</title>
    <style>
        /* Gece Modu için Renk Değişkenleri */
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --shadow: rgba(0,0,0,0.05);
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --shadow: rgba(0,0,0,0.3);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            position: relative;
        }

        /* Karanlık Mod Butonu (Sağ Üst) */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            border-radius: 20px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Sayaç Alanı */
        .sayac {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        /* Filtre Butonları */
        .filtreler {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }

        .filtre-btn {
            background: transparent;
            border: 1px solid #94a3b8;
            color: var(--text-color);
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .filtre-btn.aktif {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        ul {
            list-style: none;
            padding: 0;
            width: 320px;
            margin-top: 15px;
        }

        li {
            background: var(--card-bg);
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px var(--shadow);
            cursor: pointer;
            user-select: none;
            transition: background-color 0.3s;
        }

        .gorev-sol {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tik-kutusu {
            font-weight: bold;
            color: #94a3b8;
            font-size: 16px;
            width: 18px;
            text-align: center;
        }

        .tamamlandi .tik-kutusu {
            color: #22c55e;
            font-weight: bold;
        }

        .sil-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
        }

        /* Toplu Temizleme Butonu */
        .temizle-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Gece / Gündüz Modu Butonu -->
    <button class="theme-toggle" onclick="temaDegistir()">🌙 Gece Modu</button>

    <h1>📅 Ajandam</h1>
    
    <!-- Sayaç -->
    <div class="sayac" id="sayacMetni">Toplam 0 görevden 0 tanesi tamamlandı.</div>

    <div>
        <input type="text" id="gorevInput" placeholder="Yeni görev yaz...">
        <button onclick="gorevEkle()">Ekle</button>
    </div>

    <!-- Filtre Butonları -->
    <div class="filtreler">
        <button class="filtre-btn aktif" onclick="filtrele('hepsi', this)">Hepsini Göster</button>
        <button class="filtre-btn" onclick="filtrele('aktif', this)">Yapılacaklar</button>
        <button class="filtre-btn" onclick="filtrele('tamamlandi', this)">Tamamlananlar</button>
    </div>

    <ul id="liste"></ul>

    <!-- Bitenleri Temizle -->
    <button class="temizle-btn" onclick="tamamlananlariTemizle()">Tamamlanan Görevleri Sil</button>

    <script>
        let mevcutFiltre = 'hepsi';

        window.onload = function() {
            gorevleriYukle();
            temaYukle();

            let kutu = document.getElementById("gorevInput");
            kutu.addEventListener("keypress", function(e) {
                if (e.key === "Enter") {
                    gorevEkle();
                }
            });
        };

        function gorevEkle() {
            let kutu = document.getElementById("gorevInput");
            if (kutu.value.trim() === "") {
                alert("Lütfen bir görev yazın!");
                return;
            }

            gorevOlustur(kutu.value, false);
            kaydet();
            kutu.value = "";
        }

        function gorevOlustur(metin, tamamlandiMi) {
            let liste = document.getElementById("liste");
            let yeniMadde = document.createElement("li");

            if (tamamlandiMi) {
                yeniMadde.classList.add("tamamlandi");
            }

            let tikSimgesi = tamamlandiMi ? "✓" : "○";

            yeniMadde.innerHTML = `
                <div class="gorev-sol">
                    <span class="tik-kutusu">${tikSimgesi}</span>
                    <span>${metin}</span>
                </div>
                <button class="sil-btn">Sil</button>
            `;

            // Tıklama tespiti
            yeniMadde.onclick = function(e) {
                if (e.target.tagName !== 'BUTTON') {
                    this.classList.toggle("tamamlandi");
                    
                    let tik = this.querySelector(".tik-kutusu");
                    if (this.classList.contains("tamamlandi")) {
                        tik.textContent = "✓";
                    } else {
                        tik.textContent = "○";
                    }

                    kaydet();
                    filtreUygula();
                }
            };

            // Sil butonu
            yeniMadde.querySelector(".sil-btn").onclick = function() {
                yeniMadde.remove();
                kaydet();
            };

            liste.appendChild(yeniMadde);
            filtreUygula();
        }

        // Sayaç Güncelleme
        function sayaciGuncelle() {
            let tumu = document.querySelectorAll("#liste li").length;
            let bitenler = document.querySelectorAll("#liste li.tamamlandi").length;
            document.getElementById("sayacMetni").textContent = `Toplam ${tumu} görevden ${bitenler} tanesi tamamlandı.`;
        }

        // Filtreleme Mantığı
        function filtrele(tur, btn) {
            mevcutFiltre = tur;
            document.querySelectorAll(".filtre-btn").forEach(b => b.classList.remove("aktif"));
            btn.classList.add("aktif");
            filtreUygula();
        }

        function filtreUygula() {
            let maddeler = document.querySelectorAll("#liste li");
            maddeler.forEach(li => {
                if (mevcutFiltre === 'hepsi') {
                    li.style.display = "flex";
                } else if (mevcutFiltre === 'aktif') {
                    li.style.display = li.classList.contains("tamamlandi") ? "none" : "flex";
                } else if (mevcutFiltre === 'tamamlandi') {
                    li.style.display = li.classList.contains("tamamlandi") ? "flex" : "none";
                }
            });
            sayaciGuncelle();
        }

        // Tamamlananları Toplu Silme
        function tamamlananlariTemizle() {
            let bitenler = document.querySelectorAll("#liste li.tamamlandi");
            bitenler.forEach(li => li.remove());
            kaydet();
        }

        // Tema (Gece Modu) Değiştirme
        function temaDegistir() {
            document.body.classList.toggle("dark-mode");
            let btn = document.querySelector(".theme-toggle");
            
            if (document.body.classList.contains("dark-mode")) {
                btn.textContent = "☀️ Gündüz Modu";
                localStorage.setItem("ajandaTema", "dark");
            } else {
                btn.textContent = "🌙 Gece Modu";
                localStorage.setItem("ajandaTema", "light");
            }
        }

        function temaYukle() {
            let kayitliTema = localStorage.getItem("ajandaTema");
            if (kayitliTema === "dark") {
                document.body.classList.add("dark-mode");
                document.querySelector(".theme-toggle").textContent = "☀️ Gündüz Modu";
            }
        }

        // Kaydetme & Yükleme
        function kaydet() {
            let tumGorevler = [];
            let maddeler = document.querySelectorAll("#liste li");

            maddeler.forEach(function(li) {
                tumGorevler.push({
                    metin: li.querySelector(".gorev-sol span:last-child").textContent,
                    tamamlandi: li.classList.contains("tamamlandi")
                });
            });

            localStorage.setItem("ajandaGorevleri", JSON.stringify(tumGorevler));
            sayaciGuncelle();
        }

        function gorevleriYukle() {
            let kayitli = localStorage.getItem("ajandaGorevleri");
            if (kayitli) {
                let liste = JSON.parse(kayitli);
                liste.forEach(function(item) {
                    gorevOlustur(item.metin, item.tamamlandi);
                });
            }
            sayaciGuncelle();
        }
    </script>

</body>
</html>
